[package]
name = "srng-renderer"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "Reference renderer for SRNG-SCENE"
license = "Apache-2.0"

[lib]
path = "src/lib2.rs"

[features]
default = ["cpu"]
cpu = ["dep:vello_cpu"]
gpu = ["dep:vello_hybrid", "dep:wgpu"]

[dependencies]
srng = { path = ".." }
kurbo = "0.13.1"
peniko = "0.6.1"
vello_cpu = { version = "0.2.0", optional = true }
vello_hybrid = { version = "0.2.0", optional = true }
wgpu = { version = "29.0.4", optional = true }
