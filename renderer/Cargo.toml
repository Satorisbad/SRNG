[package]
name = "srng-renderer"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "Reference renderer for SRNG-SCENE"
license = "Apache-2.0"

[lib]
path = "src/lib2.rs"

[[bin]]
name = "srng-render"
path = "src/bin/srng-render.rs"
required-features = ["cpu"]

[features]
default = ["cpu"]
cpu = ["dep:vello_cpu", "dep:png"]
gpu = ["cpu", "dep:vello_hybrid", "dep:vello_common", "dep:wgpu"]

[dependencies]
srng = { path = ".." }
fontdb = "0.23"
ttf-parser = "0.25"
kurbo = "0.13.1"
peniko = "0.6.1"
roxmltree = "0.20"
base64 = "0.22.1"
image = { version = "0.25.8", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
png = { version = "0.17.16", optional = true }
resvg = "0.45.1"
vello_common = { version = "0.2.0", optional = true }
vello_cpu = { version = "0.2.0", optional = true }
vello_hybrid = { version = "0.2.0", optional = true }
wgpu = { version = "29.0.4", optional = true }
