[package]
name = "srng"
version = "0.1.0"
edition = "2021"
description = "First reference compiler for the SRNG vector format"
license = "Apache-2.0"

[lib]
name = "srng"
path = "src/lib.rs"

[[bin]]
name = "srngc"
path = "src/main.rs"

[[bin]]
name = "srngr"
path = "src/bin/srngr.rs"

[[bin]]
name = "srng-svg"
path = "src/bin/srng-svg.rs"

[dependencies]
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
