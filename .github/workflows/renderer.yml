name: Renderer

on:
  push:
    branches: [renderer-v0.1, svg-fidelity-complete-v0.5, filter-graph-v0.6, svg-fidelity-integrated-v0.6]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  runtime:
    name: Runtime regression / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-targets --locked

  renderer-cpu:
    name: Renderer CPU / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --manifest-path renderer/Cargo.toml
      - run: cargo test --manifest-path renderer/Cargo.toml
      - run: bash scripts/check-svg-fidelity-v05.sh
      - run: bash scripts/check-filter-graph-v06.sh

  renderer-gpu:
    name: Renderer GPU type-check / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --manifest-path renderer/Cargo.toml --no-default-features --features gpu
      - run: cargo test --manifest-path renderer/Cargo.toml --no-default-features --features gpu --lib --test gpu_resources
